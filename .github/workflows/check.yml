name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # every Monday, to catch new Python and library releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Test the checker
        run: uv run --locked pytest
      - name: Check the skills
        run: uv run --locked tools/check_skills.py
